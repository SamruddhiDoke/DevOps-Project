# Copy to inventory.ini (git-ignored) and set the Jenkins public IP:
#   terraform -chdir=../terraform output -raw jenkins_public_ip
# SSH uses the EC2 key pair named by the Terraform variable jenkins_key_name.
[jenkins]
jenkins-server ansible_host=203.0.113.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/UniversalKey.pem

---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - unzip
      - xz-utils
      - git
      - jq
      - fontconfig
      - unattended-upgrades
      - openssh-server
      - python3-debian   # required by ansible.builtin.deb822_repository
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# `sshd -t` (used to validate the change below) needs this directory, which systemd only creates
# while ssh.service runs; Ubuntu 24.04 starts sshd on demand via ssh.socket.
- name: Ensure the sshd privilege-separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Harden SSH (key-based login only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    # Reject a config that would break sshd (and lock out SSH access)
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

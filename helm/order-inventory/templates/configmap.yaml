apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    {{- include "oi.labels" . | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.environment | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  JAVA_OPTS: {{ .Values.config.javaOpts | quote }}
  {{- if .Values.config.logFormat }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: {{ .Values.config.logFormat | quote }}
  {{- end }}

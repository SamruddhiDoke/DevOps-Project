# ==========================================================
# Application Configuration
# ==========================================================
spring.application.name=order-inventory-backend
server.port=8080

# Finish in-flight requests before the JVM exits (Kubernetes rolling updates / docker stop)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==========================================================
# MySQL Database Configuration
# Every value below is overridable via environment variables
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
# The defaults only target the local Docker Compose MySQL published on port 3307.
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3307/order_inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=inventory
spring.datasource.password=inventory_local_dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool: fail fast instead of hanging requests when the database is unreachable
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================
# Schema management: Flyway owns the schema (src/main/resources/db/migration);
# Hibernate only validates that the entities match it.
# Databases created before Flyway was adopted are baselined at version 1 (no changes to
# existing tables or data); later migrations then apply normally.
# Local demo data: add classpath:db/seed to SPRING_FLYWAY_LOCATIONS (docker-compose.yml does).
# ==========================================================
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==========================================================
# JPA / Hibernate Configuration
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# CORS
# The UI is served same-origin (/api via nginx or ALB), so CORS is only needed when the
# frontend is hosted on another origin. Comma-separated list; "*" allows any origin.
# ==========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==========================================================
# Logging
# Set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs to emit ECS JSON lines for Elasticsearch/Filebeat.
# ==========================================================
logging.level.com.example.orderinventory=INFO
# Fields added to every ECS JSON log line, and the request id in plain-text logs
logging.structured.ecs.service.environment=${APP_ENVIRONMENT:local}
logging.pattern.correlation=[%X{requestId:-}] 

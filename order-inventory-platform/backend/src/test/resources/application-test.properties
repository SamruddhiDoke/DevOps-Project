# Isolated in-memory database for automated tests (never touches a real MySQL instance)
spring.datasource.url=jdbc:h2:mem:order_inventory_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Flyway applies the real migrations to the in-memory database; Hibernate validates them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.com.example.orderinventory=WARN

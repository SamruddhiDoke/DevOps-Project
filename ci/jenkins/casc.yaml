# Jenkins Configuration as Code for the local CI controller.
# Secrets are injected from environment variables (never stored in this file).
jenkins:
  systemMessage: "Order & Inventory CI (configured as code: ci/jenkins/casc.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: admin
            permissions: ["Overall/Administer"]

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonarqube-token
              description: SonarQube analysis token
              secret: "${SONAR_TOKEN}"

jobs:
  - script: >
      pipelineJob('order-inventory') {
        parameters {
          booleanParam('DEPLOY', false, 'Push to ECR and deploy to EKS (requires AWS)')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url("${REPO_URL}") }
                branch("*/main")
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
